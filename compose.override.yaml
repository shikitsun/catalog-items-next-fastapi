services:
  backend:
    environment:
      - UV_NO_DEV=0
    user: root

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/

        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend/Dockerfile.dev
    expose:
      - 3000
    environment:
      NODE_ENV: development
      API_URL: http://localhost:9091

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - ./frontend/node_modules/
            - ./.frontend/.next/
        - action: rebuild
          path: ./frontend/package.json
