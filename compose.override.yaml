services:
  backend:
    environment:
      - UV_NO_DEV=0
    user: root
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 9091

    volumes:
      - ./backend:/app
      - /app/.venv

    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/

        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - ./node_modules/
            - ./.next/
        - action: rebuild
          path: ./frontend/package.json

  bot:
    develop:
      watch:
        - action: rebuild
          path: ./bot
          target: /usr/src/app
          ignore:
            - .venv/

        - action: rebuild
          path: ./bot/requirements.txt
