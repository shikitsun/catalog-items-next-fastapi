services:
  backend:
    environment:
      - UV_NO_DEV=0
    user: root

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/

        - action: rebuild
          path: ./pyproject.toml

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_URL: http://localhost:9091
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - ./node_modules/
            - ./.next/
        - action: rebuild
          path: ./package.json
