[project]
name = "bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "shikitsun", email = "tempest0zeta@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "httpx>=0.28.1",
    "redis>=8.1.0",
]

[project.scripts]
bot = "bot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
