[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "shikitsun", email = "tempest0zeta@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.20.1",
	"asyncpg>=0.32.0",
	"fastapi[standard]>=0.162.0",
	"minio>=7.2.20",
	"pydantic>=2.14.2",
	"pydantic-settings>=2.16.2",
	"sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# env must be loaded before the app modules are imported
"tests/conftest.py" = ["E402"]
