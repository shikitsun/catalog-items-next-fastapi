[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "shikitsun", email = "tempest0zeta@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.20.1",
	"asyncpg>=0.32.0",
	"fastapi[standard]>=0.162.0",
	"minio>=7.2.20",
	"pydantic>=2.14.2",
	"pydantic-settings>=2.16.2",
	"sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
