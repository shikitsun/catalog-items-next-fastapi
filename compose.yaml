# Dev services: backend are exposed, frontend don't included

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - db-data:/data/postgres
    networks:
      - db-network
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # taken from silo guidlines
    ports: ["9000:9000", "9001:9001"]
    env_file:
      - .env
    networks:
      - minio-network
    volumes:
      - minio1-volume:/data
      - minio2-volume:/data2
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    networks:
      - minio-network
      - db-network
      - backend-network
    ports:
      - "9091:9091"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: true

  frontend:
    build: ./frontend
    networks:
      - backend-network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    environment:
      API_URL: "http://backend:9091"
      NODE_VERSION: "24-alpine"

  bot:
    build: ./bot
    networks:
      - backend-network
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    # restart: unless-stopped
    tty: true

networks:
  minio-network:
    driver: bridge
  db-network:
    driver: bridge
  backend-network:

volumes:
  minio1-volume:
  minio2-volume:
  db-data:
    driver: local
