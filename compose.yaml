# Dev services: backend are exposed, frontend don't included

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - db-data:/data/postgres
    networks:
      - db-network
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    networks:
      - minio-network
    volumes:
      - minio1-volume:/data
      - minio2-volume:/data2
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    networks:
      - minio-network
      - db-network
      - backend-network
    volumes:
      - ./backend:/app
      - backend-volume:/app/.venv
    user: root

    depends_on:
      db:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: true
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9091/health', timeout=2); assert json.load(r).get('status') == 'ok'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    networks:
      - backend-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      API_URL: "http://backend:9091"
      NODE_VERSION: "24-alpine"

  bot:
    build: ./bot
    networks:
      - backend-network
    user: root
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    # restart: unless-stopped
    tty: true

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "9000:9000"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
    networks:
      - backend-network
      - minio-network
    depends_on:
      - frontend
      - bot
      - minio

networks:
  minio-network:
    driver: bridge
  db-network:
    driver: bridge
  backend-network:

volumes:
  minio1-volume:
  minio2-volume:
  db-data:
    driver: local
  backend-volume:
